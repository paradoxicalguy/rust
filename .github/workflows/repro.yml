name: Repro Check

on:
  workflow_dispatch: {}

jobs:
  repro-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          submodules: false

      - name: make HEAD a merge on top of upstream
        run: |
          BASE=$(git rev-list --author-date-order --author='bors@rust-lang.org' -n1 HEAD)
          echo "upstream base: $BASE"
          git checkout -q "$BASE"
          git -c user.name=ci -c user.email=ci@example.com merge --no-ff --no-edit "$GITHUB_SHA"
          git show -s --format='%H parents: %P' HEAD
      - name: write bootstrap.toml
        run: |
          printf 'change-id = "ignore"\n[llvm]\ndownload-ci-llvm = true\n' > bootstrap.toml
          cat bootstrap.toml
      - name: disk usage before
        run: df -h

      - name: free up disk space
        run: src/ci/scripts/free-disk-space-linux.sh

      - name: initialize required submodules
        run: git submodule update --init --jobs 4 src/llvm-project library/backtrace

      - name: build repro-check
        run: python x.py build --stage 2 src/tools/repro-check

      - name: run repro-check
        continue-on-error: true
        run: |
          set -o pipefail
          ./build/x86_64-unknown-linux-gnu/stage1-tools-bin/repro-check --src-root . \
            | tee repro_run.log

      - name: inspect and collect compiler builtins
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p compiler-builtins-diagnostic

          A_ROOT="../rust-repro-workspace/build-a/build"
          B_ROOT="../rust-repro-workspace/build-b/extra1/extra2/extra3/extra4/extra5/extra6/extra7/extra8/extra9/extra10/build"

          A=$(find "$A_ROOT" -type f -path '*/stage1/lib/rustlib/*/lib/libcompiler_builtins-*.rlib' -print -quit)
          B=$(find "$B_ROOT" -type f -path '*/stage1/lib/rustlib/*/lib/libcompiler_builtins-*.rlib' -print -quit)

          echo "A=$A"
          echo "B=$B"

          if [[ -z "$A" || -z "$B" ]]; then
            echo "::error::Missing one or both stage1 compiler_builtins archives"
            exit 1
          fi

          cp "$A" compiler-builtins-diagnostic/A.rlib
          cp "$B" compiler-builtins-diagnostic/B.rlib

          sha256sum compiler-builtins-diagnostic/*.rlib \
            | tee compiler-builtins-diagnostic/hashes.txt

          ar t compiler-builtins-diagnostic/A.rlib \
            > compiler-builtins-diagnostic/members_a.txt
          ar t compiler-builtins-diagnostic/B.rlib \
            > compiler-builtins-diagnostic/members_b.txt

          diff -u \
            compiler-builtins-diagnostic/members_a.txt \
            compiler-builtins-diagnostic/members_b.txt \
            > compiler-builtins-diagnostic/member_names.diff || true

          if cmp -s compiler-builtins-diagnostic/A.rlib compiler-builtins-diagnostic/B.rlib; then
            echo "RESULT: MATCH"
          else
            echo "RESULT: MISMATCH"
          fi

      - name: upload compiler builtins
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-builtins-${{ github.run_number }}
          path: compiler-builtins-diagnostic/
          if-no-files-found: warn
          compression-level: 0
      - name: disk usage after
        if: always()
        run: df -h

      - name: upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repro-check-report-${{ github.run_number }}
          path: |
            **/report.html
            **/*repro_report*.html
            repro_run.log
            diffoscope_driver.txt
            driver_locations.txt
            sections.diff
            sections_a.txt
            paths_a.txt
            paths_b.txt
            a_debug_line.bin
            b_debug_line.bin
            debug_line_extra_count_b.txt
          if-no-files-found: warn
