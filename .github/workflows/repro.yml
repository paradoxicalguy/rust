name: Repro Check

on:
  workflow_dispatch: {}

jobs:
  repro-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 2
          submodules: recursive

      - name: disk usage before
        run: df -h

      - name: free up disk space
        run: src/ci/scripts/free-disk-space-linux.sh

      - name: build repro-check
        run: python x.py build --stage 2 src/tools/repro-check

      - name: run repro-check
        run: |
          ./build/x86_64-unknown-linux-gnu/stage2-tools-bin/repro-check --src-root . \
            | tee repro_run.log

      - name: disk usage after
        if: always()
        run: df -h

      - name: upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repro-check-report-${{ github.run_number }}
          path: |
            **/report.html
            **/*repro_report*.html
            repro_run.log
          if-no-files-found: warn
