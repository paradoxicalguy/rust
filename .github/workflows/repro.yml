name: Repro Check

on:
  workflow_dispatch: {}

jobs:
  repro-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: make HEAD a merge on top of upstream
        run: |
          BASE=$(git rev-list --author-date-order --author='bors@rust-lang.org' -n1 HEAD)
          echo "upstream base: $BASE"
          git checkout -q "$BASE"
          git -c user.name=ci -c user.email=ci@example.com merge --no-ff --no-edit "$GITHUB_SHA"
          git show -s --format='%H parents: %P' HEAD
      - name: write bootstrap.toml
        run: |
          printf 'change-id = "ignore"\n[llvm]\ndownload-ci-llvm = true\n' > bootstrap.toml
          cat bootstrap.toml
      - name: disk usage before
        run: df -h

      - name: free up disk space
        run: src/ci/scripts/free-disk-space-linux.sh

      - name: build repro-check
        run: python x.py build --stage 2 src/tools/repro-check

      - name: run repro-check
        run: |
          set -o pipefail
          ./build/x86_64-unknown-linux-gnu/stage1-tools-bin/repro-check --src-root . \
            | tee repro_run.log

      - name: diffoscope on librustc_driver
        if: always()
        run: |
          A=$(find build/repro_workspace/build-a -name 'librustc_driver-*.so' -path '*stage2*' | head -1)
          B=$(find build/repro_workspace/build-b -name 'librustc_driver-*.so' -path '*stage2*' | head -1)
          echo "A=$A"; echo "B=$B"
          ls -l "$A" "$B"
          cmp "$A" "$B" | head -1 || true
          strings -a "$A" | grep -F 'build-a' | sort -u | head -50 > paths_a.txt || true
          strings -a "$B" | grep -F 'build-b' | sort -u | head -50 > paths_b.txt || true
          readelf -SW "$A" > sections_a.txt
          readelf -SW "$B" > sections_b.txt
          diff sections_a.txt sections_b.txt > sections.diff || true
          find build/repro_workspace/build-a -name 'librustc_driver-*' | tee driver_locations.txt
      - name: disk usage after
        if: always()
        run: df -h

      - name: upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repro-check-report-${{ github.run_number }}
          path: |
            **/report.html
            **/*repro_report*.html
            repro_run.log
            diffoscope_driver.txt
            driver_locations.txt
            sections.diff
            sections_a.txt
            paths_a.txt
            paths_b.txt
          if-no-files-found: warn
